name: Web assets server status

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Test web assets server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        protocol:
          - http
          - https
        path:
          - index.html comp
          - css/etc/Help.css comp
          - js/etc/Help.js comp
          - json/maintenance/maintenance.json comp
          - resource/image_web/common/global/connecting.png
          - resource/image_web/test/bg/web_common.jpg
        compression:
          - identity
          - gzip
          - br

    steps:
      - name: Test ${{ matrix.protocol }} ${{ matrix.path }}
        env:
          HOST: ${{ secrets.WEB_HOST }}
          SUBPATH: ${{ secrets.SUBPATH }}
          PUBKEY: ${{ secrets.WEB_PUBKEY }}
          HEADERS: ${{ secrets.HEADERS }}
        run: |
          PROTOCOL="${{ matrix.protocol }}"
          PATH_ENTRY="${{ matrix.path }}"
          FILEPATH="${PATH_ENTRY% *}"
          COMP_FLAG="${PATH_ENTRY#* }"
          if [ "${COMP_FLAG}" = "comp" ]; then
            COMPRESSION="${{ matrix.compression }}"
          else
            COMPRESSION="identity"
          fi
          if [ "${COMPRESSION}" = "gzip" ]; then
            ACCEPT_ENCODING="gzip"
          elif [ "${COMPRESSION}" = "br" ]; then
            ACCEPT_ENCODING="br"
          elif [ "${COMPRESSION}" = "identity" ]; then
            ACCEPT_ENCODING="identity"
          fi

          BODYFILE=$(mktemp)
          CURL_HEADER_OPTS=()
          while IFS= read -r line; do
            CURL_HEADER_OPTS+=("-H" "${line}")
          done <<< "${HEADERS}"
          CURL_OPTS=(-f -s -D - -o "${BODYFILE}" "${PROTOCOL}://${HOST}/${SUBPATH}/${FILEPATH}")
          if [ -n "${ACCEPT_ENCODING}" ]; then
            CURL_OPTS+=("--compressed" "-H" "Accept-Encoding: ${ACCEPT_ENCODING}")
          fi
          if [ "${PROTOCOL}" = "https" ]; then
            # TODO: make --pinnedpubkey ${PUBKEY} work
            CURL_OPTS+=(--tlsv1.2)
          fi
          RESPONSE=$(curl "${CURL_HEADER_OPTS[@]}" "${CURL_OPTS[@]}")
          CODE=$(echo "${RESPONSE}" | head -1 | cut -d' ' -f2)
          SERVER=$(echo "${RESPONSE}" | grep -i '^Server:' | head -1 | cut -d' ' -f2- | tr -d '\r')

          test "${SERVER}" = "Totentanz"

          if [ "${PROTOCOL}" = "http" ]; then
            test "${CODE}" = "301"
            LOCATION=$(echo "${RESPONSE}" | grep -i '^Location:' | head -1 | cut -d' ' -f2- | tr -d '\r')
            test "${LOCATION}" = "https://${HOST}/${SUBPATH}/${FILEPATH}"
            SIZE=$(stat -c%s "${BODYFILE}")
            test "${SIZE}" -eq 0
          fi

          CONTENT_ENCODING=$(echo "${RESPONSE}" | grep -i '^Content-Encoding:' | head -1 | cut -d' ' -f2- | tr -d '\r')
          if [ "${COMPRESSION}" = "gzip" ]; then
            test "${CONTENT_ENCODING}" = "gzip"
          elif [ "${COMPRESSION}" = "br" ]; then
            test "${CONTENT_ENCODING}" = "br"
          elif [ "${COMPRESSION}" = "identity" ]; then
            test -z "${CONTENT_ENCODING}"
          fi

          if [ "${PROTOCOL}" = "https" ]; then
            test "${CODE}" = "200"
            case "${FILEPATH##*.}" in
              html) file "${BODYFILE}" | grep -q HTML ;;
              css)  file "${BODYFILE}" | grep -q text ;;
              js)   file "${BODYFILE}" | grep -q text ;;
              json) file "${BODYFILE}" | grep -q JSON ;;
              png)  file "${BODYFILE}" | grep -q PNG ;;
              jpg)  file "${BODYFILE}" | grep -q JPEG ;;
            esac
          fi

          rm -f "${BODYFILE}"
